<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Registro de Usuario</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <!-- Logo y navegación aquí si lo necesitas -->
  </header>

  <main>
    <section class="registro-usuario">
      <h1>Registro de Usuario</h1>
      <form id="formRegistro">
        <label for="nombre">NOMBRE COMPLETO</label>
        <input type="text" id="nombre" name="nombre" required maxlength="100">

        <label for="correo">CORREO</label>
        <input type="email" id="correo" name="correo" required maxlength="100">

        <label for="contrasena">CONTRASEÑA</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="4" maxlength="10">

        <label for="confirmar">CONFIRMAR CONTRASEÑA</label>
        <input type="password" id="confirmar" name="confirmar" required minlength="4" maxlength="10">

        <label for="telefono">TELÉFONO (opcional)</label>
        <input type="tel" id="telefono" name="telefono">

        <label for="region">REGIÓN</label>
        <select id="region" name="region" required>
          <option value="">-- Seleccione la región --</option>
          <option value="RM">Región Metropolitana de Santiago</option>
          <option value="AR">Región de la Araucanía</option>
          <option value="NB">Región de Ñuble</option>
        </select>

        <label for="comuna">COMUNA</label>
        <select id="comuna" name="comuna" required>
          <option value="">-- Seleccione la comuna --</option>
          <option value="Linares">Linares</option>
          <option value="Longaví">Longaví</option>
          <option value="Concepción">Concepción</option>
        </select>

        <button type="submit">REGISTRAR</button>
      </form>
    </section>
  </main>

  <footer>
    <!-- Footer si lo necesitas -->
  </footer>

  <script src="../js/loginRegistro.js"></script>
</body>
</html>
